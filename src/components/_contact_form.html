<section class="contact-section" id="contact">
    <div class="site-container">
        <form class="contact-form">
            <div class="contact-form__row">
                <label class="form-field"><span>Full Name</span><input type="text" placeholder="Type here"></label>
                <label class="form-field"><span>Email</span><input type="email" placeholder="Type here"></label>
            </div>
            <div class="form-box">
                <h3>Why are you contacting us?</h3>
                <ul class="check-list">
                    <li><label><input type="checkbox" checked> Web Design</label></li>
                    <li><label><input type="checkbox"> Collaboration</label></li>
                    <li><label><input type="checkbox"> Mobile App Design</label></li>
                    <li><label><input type="checkbox"> Others</label></li>
                </ul>
            </div>
            <div class="form-box">
                <h3>Your Budget</h3>
                <p>Slide to indicate your budget range</p>
                <div class="budget-line"><span></span></div>
                <div class="budget-price"><span>$1000</span><span>$5000</span></div>
            </div>
            <label class="form-box form-box--message"><span>Your Message</span><textarea placeholder="Type here"></textarea></label>
            <button class="button button--accent" type="submit">Submit</button>
        </form>
    </div>
</section>
